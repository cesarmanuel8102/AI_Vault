<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Visual Trace Console v1</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --border: #2e3350; --accent: #6c63ff; --text: #e2e8f0;
    --info: #58a6ff; --warning: #f0883e; --high: #e04e4e; --critical: #ff4d4f;
  }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--surface2); }
  .badge.connected { background: #238636; color: #fff; }
  .badge.disconnected { background: #ff4d4f; color: #fff; }
  .filters { display: flex; gap: 8px; }
  .filter-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .event { display: flex; gap: 12px; padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; background: var(--surface); border-left: 4px solid transparent; }
  .event[data-severity="info"] { border-left-color: var(--info); }
  .event[data-severity="warning"] { border-left-color: var(--warning); }
  .event[data-severity="high"] { border-left-color: var(--high); }
  .event[data-severity="critical"] { border-left-color: var(--critical); }
  .event-icon { width: 24px; text-align: center; font-size: 18px; line-height: 1; }
  .event-content { flex: 1; }
  .event-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .event-text { font-size: 12px; color: #b0b8c4; line-height: 1.4; }
  .event-ts { font-size: 11px; color: #8b95a5; white-space: nowrap; }
  footer { padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 11px; color: #8b95a5; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>🧠 Agent Visual Trace Console v1</h1>
  <div class="badge" id="conn-badge">Disconnected</div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-type="all">All</button>
    <button class="filter-btn" data-type="thinking">Thinking</button>
    <button class="filter-btn" data-type="tool">Tool</button>
    <button class="filter-btn" data-type="evidence">Evidence</button>
    <button class="filter-btn" data-type="governance">Governance</button>
  </div>
</header>
<main id="event-list"></main>
<footer>
  <span id="last-ts">No events yet</span>
  <span>Room: <strong>default</strong> | Run: <strong>default</strong></span>
</footer>

<script>
(function() {
  const roomId = new URLSearchParams(location.search).get('room_id') || 'default';
  const runId  = new URLSearchParams(location.search).get('run_id') || 'default';
  const list = document.getElementById('event-list');
  const badge = document.getElementById('conn-badge');
  const lastTs = document.getElementById('last-ts');
  let activeFilter = 'all';

  const icons = {
    thinking: '🧠', tool: '🔧', finding: '🔍', file: '📄',
    evidence: '📊', governance: '⚖', decision: '✅', status: '⏳', health: '♥', warning: '⚠', error: '❌'
  };

  function renderEvent(evt) {
    const icon = icons[evt.type] || '•';
    const el = document.createElement('div');
    el.className = 'event';
    el.setAttribute('data-type', evt.type);
    el.setAttribute('data-severity', evt.severity || 'info');
    el.innerHTML = '<div class="event-icon">' + icon + '</div>' +
      '<div class="event-content">' +
        '<div class="event-title">' + (evt.title || evt.type) + '</div>' +
        '<div class="event-text">' + (evt.text || '') + '</div>' +
      '</div>' +
      '<div class="event-ts">' + (evt.ts || '').split('.')[0].replace('T', ' ') + '</div>';
    list.insertBefore(el, list.firstChild);
    applyFilter();
    lastTs.textContent = 'Last: ' + (evt.ts || '').split('.')[0].replace('T', ' ');
  }

  function applyFilter() {
    document.querySelectorAll('.event').forEach(el => {
      el.classList.toggle('hidden', activeFilter !== 'all' && el.getAttribute('data-type') !== activeFilter);
    });
  }

  document.getElementById('filters').addEventListener('click', e => {
    if (!e.target.classList.contains('filter-btn')) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    activeFilter = e.target.getAttribute('data-type');
    applyFilter();
  });

  // Load latest snapshot
  async function loadLatest() {
    try {
      const res = await fetch('/brain/agent-trace/latest?room_id=' + roomId + '&run_id=' + runId + '&limit=200');
      if (res.ok) {
        const data = await res.json();
        if (data.events) {
          data.events.forEach(evt => renderEvent(evt));
        }
      }
    } catch(e) { console.warn('loadLatest failed', e); }
  }

  // SSE connection
  let es = null;
  function connectSSE() {
    if (es) try { es.close(); } catch(e) {}
    es = new EventSource('/brain/agent-trace/stream?room_id=' + roomId + '&run_id=' + runId);
    badge.textContent = 'Connecting...';
    badge.className = 'badge';

    es.onopen = () => {
      badge.textContent = 'Connected';
      badge.className = 'badge connected';
    };

    es.onmessage = (msg) => {
      try {
        const evt = JSON.parse(msg.data);
        renderEvent(evt);
      } catch(e) { console.warn('JSON parse error', e); }
    };

    es.onerror = () => {
      badge.textContent = 'Disconnected';
      badge.className = 'badge disconnected';
      setTimeout(connectSSE, 3000);
    };
  }

  loadLatest();
  connectSSE();
})();
</script>
</body>
</html>
