<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brain Operator Console</title>
  <link rel="stylesheet" href="/static/styles.css?v=6">
</head>
<body>
  <div id="app">
    <!-- Top status bar -->
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">Brain Console</span>
        <span class="brand-sub" id="topbar-version">v9</span>
      </div>
      <div class="topbar-status" id="topbar-status">
        <span class="chip" id="ts-brain" data-state="unknown">Brain API …</span>
        <span class="chip" id="ts-dash" data-state="unknown">Dashboard …</span>
        <span class="chip" id="ts-backend" data-state="unknown">Backend …</span>
        <span class="chip" id="ts-provider" data-state="unknown">Provider …</span>
        <span class="chip lock" id="ts-readonly" data-state="locked">READ-ONLY</span>
        <span class="chip lock" id="ts-memory" data-state="locked">MEM LOCKED</span>
        <span class="chip lock" id="ts-trading" data-state="locked">TRADING LOCKED</span>
        <span class="chip" id="ts-autonomy" data-state="unknown">Autonomy …</span>
        <span class="chip muted" id="ts-refresh">—</span>
      </div>
    </header>

    <div class="layout">
      <!-- Left navigation -->
      <nav class="sidenav" id="sidenav">
        <a class="nav-item" data-view="overview" href="#/overview"><span class="nav-ico">▣</span> Overview</a>
        <a class="nav-item" data-view="agent" href="#/agent"><span class="nav-ico">◉</span> Agent</a>
        <a class="nav-item" data-view="chat" href="#/chat"><span class="nav-ico">✎</span> Chat</a>
        <a class="nav-item" data-view="tools" href="#/tools"><span class="nav-ico">⚙</span> Tools</a>
        <a class="nav-item" data-view="memory" href="#/memory"><span class="nav-ico">❖</span> Memory</a>
        <a class="nav-item" data-view="traces" href="#/traces"><span class="nav-ico">⟲</span> Traces</a>
        <a class="nav-item" data-view="safety" href="#/safety"><span class="nav-ico">⛨</span> Safety</a>
        <a class="nav-item" data-view="ops" href="#/ops"><span class="nav-ico">⌘</span> Ops</a>
        <a class="nav-item" data-view="roadmap" href="#/roadmap"><span class="nav-ico">★</span> Roadmap</a>
        <div class="nav-footer">
          <span class="mode-badge" id="nav-mode">READ_ONLY</span>
          <button class="btn ghost sm" id="nav-refresh" title="Refresh now">↻</button>
        </div>
      </nav>

      <!-- Main content -->
      <main class="content" id="content">
        <div class="loading-screen">
          <div class="spinner"></div>
          <p>Loading Brain Console…</p>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/app.js?v=7"></script>
</body>
</html>
