name: chatgpt-day1-windows-ci

on:
  push:
    branches:
      - chatgpt/day1-writer-timeout-fix

jobs:
  full-windows-regression:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-asyncio "pydantic>=2,<3" pydantic-settings sqlalchemy defusedxml tomli ibapi ib-insync pywin32

      - name: Compile changed authority modules
        shell: pwsh
        run: |
          python -m py_compile ibkr_paper_30d/authoritative_broker_writer.py
          python -m py_compile ibkr_paper_30d/production_continuity_runtime.py

      - name: Verify immutable kernel manifest
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          from ibkr_paper_30d.kernel_manifest import verify_kernel_manifest
          root = Path('.').resolve()
          manifest = json.loads((root / 'IMMUTABLE_EXECUTION_KERNEL_MANIFEST.json').read_text(encoding='utf-8'))
          result = verify_kernel_manifest(root, manifest)
          print(result)
          assert result['verified'] is True
          '@ | python -

      - name: Parse PowerShell authority entrypoints
        shell: pwsh
        run: |
          $targets = @(
            "FINALIZE_IBKR_PREREQUISITES.ps1",
            "RUN_IBKR_DAY1_SERVICE.ps1",
            "RUN_IBKR_MARKET_DATA_GATE.ps1"
          )
          foreach ($target in $targets) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $target),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
          Write-Output "POWERSHELL_AST=PASS"

      - name: Run full IBKR Day1 regression suite
        shell: pwsh
        run: |
          pytest -q tests/ibkr_paper_30d
