name: Operator Direct PR10 Fix

on:
  push:
    branches:
      - control-plane/v156-post-merge-pilot-recovery
    paths:
      - tools/operator_patch_pr10_premerge.py
      - .github/workflows/operator-direct-pr10-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: control-plane/v156-post-merge-pilot-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply operator patch
        run: python tools/operator_patch_pr10_premerge.py
      - name: Validate patched worker
        run: |
          python -m py_compile scripts/agent_loop/local_worker/agent_worker.py
          git diff --check
          sha256sum scripts/agent_loop/local_worker/agent_worker.py
      - name: Commit patched worker
        run: |
          git config user.name "AI Vault Operator"
          git config user.email "ai-vault-operator@users.noreply.github.com"
          git add scripts/agent_loop/local_worker/agent_worker.py
          git diff --cached --quiet || git commit -m "fix(agent-loop): authorize audited pre-merge v1.5.6 recovery"
          git push origin HEAD:control-plane/v156-post-merge-pilot-recovery
