name: Operator Proxy Contract - Windows
on: {pull_request: {paths: ['scripts/operator_proxy/**','tests/contract/operator_proxy/**','docs/roadmap/**','ROADMAP_STATUS.json','docs/MIGRATION_CONTROL_LEDGER.md','.github/workflows/operator-proxy-**']}}
permissions: {contents: read}
jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: npm install
        working-directory: scripts/operator_proxy
      - run: npm run typecheck
        working-directory: scripts/operator_proxy
      - run: npm test
        working-directory: scripts/operator_proxy
      - shell: powershell
        run: tests/contract/operator_proxy/install.ps1
