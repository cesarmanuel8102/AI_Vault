name: ibkr-paper-30d-ci

concurrency:
  group: ibkr-paper-30d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - codex/autonomous-market-research-capital-adaptive-v1
  pull_request:
    paths:
      - 'ibkr_paper_30d/**'
      - 'tests/ibkr_paper_30d/**'
      - '.github/workflows/ibkr-paper-30d-ci.yml'

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pydantic defusedxml ibapi pywin32 tzdata

      - name: Compile autonomous IBKR modules
        run: |
          python -m py_compile ibkr_paper_30d/trader_invocation.py
          python -m py_compile ibkr_paper_30d/autonomous_research.py
          python -m py_compile ibkr_paper_30d/ibkr_research.py
          python -m py_compile ibkr_paper_30d/autonomous_runtime.py
          python -m py_compile ibkr_paper_30d/autonomous_scheduler.py
          python -m py_compile ibkr_paper_30d/risk.py
          python -m py_compile ibkr_paper_30d/cli.py

      - name: Run IBKR paper experiment tests
        shell: pwsh
        run: |
          # The two auditor-runtime probe files intentionally require a
          # non-elevated/restricted Windows token. GitHub-hosted Windows runners
          # execute as elevated runneradmin, and those probes correctly fail
          # closed with TOKEN_ELEVATED. They are unchanged by this PR and are
          # validated only in the dedicated restricted auditor runtime.
          python -m pytest tests/ibkr_paper_30d -q `
            --ignore=tests/ibkr_paper_30d/test_auditor_runtime.py `
            --ignore=tests/ibkr_paper_30d/test_auditor_runtime_v2.py
