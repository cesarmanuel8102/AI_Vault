name: nontrading-smoke-regression

on:
  push:
    branches:
      - codex/own-capital-sustainable-return
  pull_request:
    branches:
      - codex/own-capital-sustainable-return

jobs:
  security:
    name: Security Smoke Tests
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\tmp_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Diagnostics
        shell: pwsh
        run: |
          python -c "import os, pathlib; print('CWD:', os.getcwd()); print('GITHUB_WORKSPACE:', os.environ.get('GITHUB_WORKSPACE'))"
          Get-ChildItem -Path . -Recurse -Filter "requirements.txt" | Select-Object -First 5
      - name: P0 Security Reality Check
        shell: pwsh
        run: python -m pytest tests/smoke/test_p0_nontrading_security_reality_check_and_fix_01.py -v
      - name: Unit Security Defaults
        shell: pwsh
        run: python -m pytest tests/unit/test_phase1_security_defaults.py tests/unit/test_dev_endpoints_default_off.py -v
      - name: Governance RBAC Hardening
        shell: pwsh
        run: python -m pytest tests/smoke/test_governance_rbac_dev_god_hardening_01.py -k "not test_state_baseline_memory_counts_unchanged" -v
      - name: Governance Audit Closeout
        shell: pwsh
        run: python -m pytest tests/smoke/test_governance_hardening_a118b7f_audit_closeout_01.py -v

  memory-retrieval:
    name: Memory / Retrieval Regression
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\tmp_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Diagnostics
        shell: pwsh
        run: |
          python -c "import os, pathlib; print('CWD:', os.getcwd()); print('GITHUB_WORKSPACE:', os.environ.get('GITHUB_WORKSPACE'))"
      - name: Memory Historical Debt Cleanup
        shell: pwsh
        run: python tests/smoke/test_memory_historical_debt_cleanup_01.py
      - name: 09E Retrieval Quality Evaluation
        shell: pwsh
        run: python tests/smoke/test_09e_retrieval_quality_memory_utility_evaluation_01.py
      - name: FAISS Rebuild Hydration
        shell: pwsh
        run: python tests/smoke/test_agent_v2_faiss_rebuild_hydration_01.py
      - name: Semantic Retrieval Hygiene
        shell: pwsh
        run: python tests/smoke/test_agent_v2_semantic_retrieval_hygiene_01.py

  dashboard-trace:
    name: Dashboard / Trace Tests
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\tmp_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Diagnostics
        shell: pwsh
        run: |
          python -c "import os, pathlib; print('CWD:', os.getcwd()); print('GITHUB_WORKSPACE:', os.environ.get('GITHUB_WORKSPACE'))"
      - name: Visual Trace 8092 Canonical Path Fix
        shell: pwsh
        run: python tests/smoke/test_visual_trace_8092_canonical_path_fix_01.py

  roadmap-policy:
    name: Roadmap / Policy Regression
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\tmp_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Diagnostics
        shell: pwsh
        run: |
          python -c "import os, pathlib; print('CWD:', os.getcwd()); print('GITHUB_WORKSPACE:', os.environ.get('GITHUB_WORKSPACE'))"
      - name: Post-09E Non-Trading Roadmap Rebase
        shell: pwsh
        run: python tests/smoke/test_post_09e_nontrading_roadmap_rebase_01.py
      - name: 09D Post-Write Reconciliation Repair
        shell: pwsh
        run: python tests/smoke/test_09d_post_write_reconciliation_repair_01.py

  agent-v2-boundaries:
    name: Agent V2 Boundary Contracts
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\tmp_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Agent V2 boundary modules
        shell: pwsh
        run: |
          python -m py_compile tmp_agent/brain_v9/core/agent_kernel_v2/intent_classifier.py
          python -m py_compile tmp_agent/brain_v9/core/agent_kernel_v2/langgraph_parity_runtime.py
          python -m py_compile tests/contract/test_agent_v2_boundary_contracts_02.py
          python -m py_compile tests/smoke/test_front_brain_intent_negation_guard_03.py
          python -m py_compile tests/smoke/test_front_brain_langgraph_docstring_truth_04.py
          python -m py_compile tests/smoke/test_front_brain_dashboard_api_live_contract_06.py
          python -m py_compile tests/smoke/test_front_brain_core_path_centralization_08.py
      - name: Agent V2 contracts and focused smokes
        shell: pwsh
        run: |
          python -m pytest tests/contract/test_agent_v2_boundary_contracts_02.py tests/contract/test_main_router_topology_contract_12b.py tests/contract/test_main_router_dev_surface_guard_12c.py tests/contract/test_main_router_surface_matrix_12d.py tests/contract/test_main_router_auth_permission_contract_12e.py tests/contract/test_main_router_side_effect_boundary_12f.py tests/contract/test_main_routes_health_status_split_13a.py tests/contract/test_main_routes_startup_state_adapter_13b.py tests/contract/test_main_routes_health_status_deferred_split_13c.py tests/smoke/test_front_brain_intent_negation_guard_03.py tests/smoke/test_front_brain_langgraph_docstring_truth_04.py tests/smoke/test_front_brain_ui_token_preflight_01.py tests/smoke/test_front_brain_memory_ownership_contract_01.py tests/smoke/test_front_brain_active_path_centralization_02.py tests/smoke/test_front_brain_provider_centralization_01.py tests/smoke/test_front_brain_dashboard_api_live_contract_06.py tests/smoke/test_front_brain_core_path_centralization_08.py -q

  financial-autonomy:
    name: Financial Autonomy Dry-Run Contract
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\tmp_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Financial Autonomy dry-run modules
        shell: pwsh
        run: |
          python -m py_compile financial_autonomy/__init__.py
          python -m py_compile financial_autonomy/financial_autonomy_autobuild.py
          python -m py_compile financial_autonomy/integration_setup.py
          python -m py_compile financial_autonomy/api/financial_endpoints.py
          python -m py_compile financial_autonomy/bridge/financial_autonomy_bridge.py
          python -m py_compile financial_autonomy/bridge/trust_score_integration.py
          python -m py_compile tests/smoke/test_front_financial_autonomy_compile_contract_10.py
      - name: Financial Autonomy dry-run contract
        shell: pwsh
        run: python -m pytest tests/smoke/test_front_financial_autonomy_compile_contract_10.py -q

  hygiene-guard:
    name: Hygiene Guard
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\tmp_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check no sensitive paths staged
        shell: pwsh
        run: python scripts/git_hygiene/check_no_sensitive_paths_staged.py




