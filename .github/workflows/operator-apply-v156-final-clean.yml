name: Operator Apply V156 Final Clean

on:
  push:
    branches:
      - control-plane/operator-v156-final-clean
    paths:
      - tools/operator_apply_v156_final_clean.py
      - .github/workflows/operator-apply-v156-final-clean.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: control-plane/operator-v156-final-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact final patch
        run: python tools/operator_apply_v156_final_clean.py
      - name: Validate Python contracts
        run: |
          python -m py_compile scripts/agent_loop/local_worker/v156_recovery_transaction.py
          python -m py_compile tests/contract/test_agent_loop_worker_hardening_02.py
          python -m py_compile tests/contract/v156_dynamic_test_support.py
          python -m py_compile tests/contract/test_agent_loop_worker_v156_post_merge_recovery.py
          python tests/contract/test_agent_loop_worker_hardening_02.py
          python tests/contract/test_agent_loop_worker_v156_post_merge_recovery.py
          git diff --check
      - name: Commit final source-only patch
        run: |
          git config user.name "AI Vault Operator"
          git config user.email "ai-vault-operator@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix(agent-loop): close final v1.5.6 transaction guards"
          git push origin HEAD:control-plane/operator-v156-final-clean
