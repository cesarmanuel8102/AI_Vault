name: autonomous-research-ci

on:
  push:
    branches:
      - codex/ibkr-autonomous-research-v1
      - codex/ibkr-external-audit-remediation-v1
      - codex/ibkr-reaudit-v2-remediation
      - codex/ibkr-v3-remediation
  pull_request:
    branches:
      - codex/ibkr-paper-auditor-gate-v2

jobs:
  autonomous-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-asyncio "pydantic>=2,<3" pydantic-settings sqlalchemy defusedxml tomli ibapi ib-insync

      - name: Parse preflight PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          [void][System.Management.Automation.Language.Parser]::ParseFile("FINALIZE_IBKR_AUDITOR_ADMIN.ps1", [ref]$null, [ref]$errors)
          [void][System.Management.Automation.Language.Parser]::ParseFile("FINALIZE_IBKR_MARKET_DATA.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }

      - name: Compile autonomous modules
        run: |
          python -m py_compile ibkr_paper_30d/autonomous_research.py
          python -m py_compile ibkr_paper_30d/ibkr_research_tools.py
          python -m py_compile ibkr_paper_30d/autonomous_execution.py
          python -m py_compile ibkr_paper_30d/autonomous_runtime.py
          python -m py_compile ibkr_paper_30d/experiment_ledger.py
          python -m py_compile ibkr_paper_30d/autonomous_state.py
          python -m py_compile ibkr_paper_30d/autonomous_service.py
          python -m py_compile ibkr_paper_30d/risk.py
          python -m py_compile ibkr_paper_30d/persistence.py

      - name: Diagnostic kernel manifest
        run: |
          python -c "import json; from pathlib import Path; from ibkr_paper_30d.kernel_manifest import build_kernel_manifest; m=build_kernel_manifest(Path('.')); stored=json.loads(Path('IMMUTABLE_EXECUTION_KERNEL_MANIFEST.json').read_text(encoding='utf-8')); print('DERIVED_KERNEL_SHA='+m['kernel_manifest_sha256']); print('STORED_KERNEL_SHA='+stored['kernel_manifest_sha256']); print('DERIVED_DAY1='+json.dumps(next(x for x in m['kernel_files'] if x['path']=='ibkr_paper_30d/day1_launch.py'), sort_keys=True)); print('STORED_DAY1='+json.dumps(next(x for x in stored['kernel_files'] if x['path']=='ibkr_paper_30d/day1_launch.py'), sort_keys=True)); diffs=[(a,b) for a,b in zip(m['kernel_files'],stored['kernel_files']) if a!=b]; print('DIFF_COUNT='+str(len(diffs))); [print('DIFF='+json.dumps({'derived':a,'stored':b},sort_keys=True)) for a,b in diffs[:10]]"

      - name: Run full IBKR autonomous and regression suite
        run: |
          pytest -q tests/ibkr_paper_30d
