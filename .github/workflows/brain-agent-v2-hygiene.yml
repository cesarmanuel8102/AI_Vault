jobs:
  hygiene:
    name: Brain Agent V2 Hygiene Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Security grep guard
        shell: bash
        run: |
          set -euo pipefail

          forbidden_operator_token="AGENTV2_TEST_ADMIN_TOKEN_"
          forbidden_operator_token="${forbidden_operator_token}08F8_R1B"

          forbidden_dev_password="dev_admin_"
          forbidden_dev_password="${forbidden_dev_password}2026!"

          forbidden_old_bearer="MiClave"
          forbidden_old_bearer="${forbidden_old_bearer}UltraSegura"

          for pattern in "$forbidden_operator_token" "$forbidden_dev_password" "$forbidden_old_bearer"; do
            if git grep -n -- "$pattern"; then
              echo "FAIL: forbidden literal found in tracked files"
              exit 1
            fi
          done

          echo "OK: no forbidden secret/test credential literals found in tracked files"

      - name: Python compile critical modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tmp_agent/brain_v9/api_security.py \
            tmp_agent/brain_v9/start_safe_server.py \
            tmp_agent/brain_v9/start_local_browser_operational.py \
            tmp_agent/brain_v9/dashboard/dashboard_routes.py \
            tmp_agent/brain_v9/core/agent_kernel_v2/finalizer.py \
            tmp_agent/brain_v9/core/agent_kernel_v2/response_normalizer.py
          echo "OK: all critical modules compile"

      - name: Sanitizer regression
        shell: bash
        run: |
          set -euo pipefail
          python tmp_agent/front_brain_chat_answer_quality_hardening_02/test_sanitizer.py

      - name: Session formatter unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_session_formatters_01.py

      - name: Session query predicate unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_session_query_predicates_01.py

      - name: Session observability unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_session_observability_01.py

      - name: Session response hygiene unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_session_response_hygiene_01.py

      - name: Session curated render unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_session_curated_render_01.py

      - name: Session command handler unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_session_command_handler_01.py

      - name: Session fastpaths unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_session_fastpaths_01.py

      - name: Session Tool01 gateway unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_session_tool01_gateway_01.py

      - name: Session routing helpers unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_session_routing_helpers_01.py

      - name: Session agent route unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_session_agent_route_01.py

      - name: Session memory state unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_session_memory_state_01.py

      - name: SCVL final answer gate unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_scvl_final_answer_gate_01.py

      - name: SCVL semantic promotion gate unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_scvl_semantic_promotion_gate_01.py

      - name: Autonomy E2E memory tool fallback tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/integration/test_autonomy_e2e_memory_tool_fallback_11c.py

      - name: Ollama config centralization 11D-B tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_ollama_config_centralization_11d_b.py

      - name: Ollama config session message 11D-C tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/unit/test_ollama_config_session_message_11d_c.py

      - name: Main router topology contract 12B
        shell: bash
        run: |
          set -euo pipefail
