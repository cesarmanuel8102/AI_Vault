      - name: Static boundary compile
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tests/contract/test_agent_v2_boundary_contracts_02.py \
            tests/smoke/test_front_brain_ui_token_preflight_01.py
          echo "OK: boundary tests compile"
