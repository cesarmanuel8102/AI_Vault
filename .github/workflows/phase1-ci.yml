name: phase1-ci

on:
  push:
    branches:
      - codex/own-capital-sustainable-return
      - codex/ibkr-autonomous-research-v1
      - codex/ibkr-paper-auditor-gate-v2
      - codex/ibkr-external-audit-remediation-v1
      - codex/ibkr-reaudit-v2-remediation
      - codex/ibkr-v3-remediation
  pull_request:
    branches:
      - codex/own-capital-sustainable-return

jobs:
  phase1-baseline:
    name: Phase 1 baseline (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-asyncio "pydantic>=2,<3" pydantic-settings sqlalchemy defusedxml tomli ibapi ib-insync pywin32

      - name: py_compile critical modules
        shell: pwsh
        run: |
          python -m py_compile tmp_agent/brain_v9/main.py
          python -m py_compile tmp_agent/brain_v9/config.py
          python -m py_compile tmp_agent/brain_v9/governance/execution_gate.py
          python -m py_compile tmp_agent/brain_v9/api_security.py
          python -m py_compile tmp_agent/brain_v9/core/session.py
          python -m py_compile ibkr_paper_30d/autonomous_research.py
          python -m py_compile ibkr_paper_30d/ibkr_research_tools.py
          python -m py_compile ibkr_paper_30d/autonomous_execution.py
          python -m py_compile ibkr_paper_30d/autonomous_runtime.py
          python -m py_compile ibkr_paper_30d/risk.py
          python -m py_compile ibkr_paper_30d/experiment_ledger.py
          python -m py_compile ibkr_paper_30d/autonomous_state.py
          python -m py_compile ibkr_paper_30d/autonomous_service.py
          python -m py_compile ibkr_paper_30d/prerequisite_tools.py
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'FINALIZE_IBKR_PREREQUISITES.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'RUN_IBKR_MARKET_DATA_GATE.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'SYNC_LOCAL_CODEX_IBKR.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Phase 0 security tests
        shell: pwsh
        run: |
          python tests/unit/test_execution_gate_god_p3.py
          python tests/unit/test_dev_endpoints_default_off.py
          python tests/unit/test_selfdev_protected_paths.py

      - name: Phase 1 baseline tests
        shell: pwsh
        run: |
          python tests/unit/test_phase1_import_baseline.py
          python tests/unit/test_phase1_security_defaults.py

      - name: Full IBKR autonomous and regression suite
        shell: pwsh
        run: |
          pytest -q tests/ibkr_paper_30d

      - name: Import smoke
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'tmp_agent'); from brain_v9.governance.execution_gate import ExecutionGate; from brain_v9.config import BRAIN_ENABLE_UNSAFE_DEV_ENDPOINTS; print('PHASE1_CI_IMPORT_SMOKE_OK')"
