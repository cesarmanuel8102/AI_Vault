name: Operator Cleanup PR10

on:
  push:
    branches:
      - control-plane/v156-post-merge-pilot-recovery
    paths:
      - tools/operator_cleanup_pr10.py
      - .github/workflows/operator-cleanup-pr10.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: control-plane/v156-post-merge-pilot-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply authority cleanup
        run: python tools/operator_cleanup_pr10.py
      - name: Validate single recovery authority
        run: |
          python -m py_compile scripts/agent_loop/local_worker/agent_worker.py
          python -m py_compile scripts/agent_loop/local_worker/v156_post_merge_recovery.py
          python -m py_compile scripts/agent_loop/local_worker/v156_recovery_common.py
          python -m py_compile scripts/agent_loop/local_worker/v156_recovery_transaction.py
          python tests/contract/test_agent_loop_worker_hardening_02.py
          python tests/contract/test_agent_loop_worker_v153_regression.py
          python tests/contract/test_agent_loop_worker_v153_base_advance.py
          python tests/contract/test_agent_loop_worker_v154_repair.py
          python tests/contract/test_agent_loop_worker_v154_transaction_notifications.py
          python tests/contract/test_agent_loop_worker_v155_quiescence_recovery.py
          python tests/contract/test_agent_loop_worker_v156_post_merge_recovery.py
          git diff --check
      - name: Commit final direct fix
        run: |
          git config user.name "AI Vault Operator"
          git config user.email "ai-vault-operator@users.noreply.github.com"
          git add scripts/agent_loop/local_worker/agent_worker.py \
                  scripts/agent_loop/local_worker/worker_contract.json \
                  tests/contract/test_agent_loop_worker_hardening_02.py
          git rm tools/operator_cleanup_pr10.py .github/workflows/operator-cleanup-pr10.yml
          git commit -m "fix(agent-loop): consolidate v1.5.6 recovery authority"
          git push origin HEAD:control-plane/v156-post-merge-pilot-recovery
