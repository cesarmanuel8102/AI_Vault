name: Agent Loop Worker Contract

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/own-capital-sustainable-return
    paths:
      - scripts/agent_loop/**
      - tests/contract/test_agent_loop_worker_hardening_02.py
      - tests/contract/test_agent_loop_worker_v153_regression.py
      - tests/contract/test_agent_loop_worker_v153_base_advance.py
      - tests/contract/test_agent_loop_worker_v154_repair.py
      - tests/contract/test_agent_loop_worker_v154_transaction_notifications.py
      - tests/contract/test_agent_loop_worker_v154_deploy_rollback.ps1
      - tests/contract/test_agent_loop_worker_v155_quiescence_recovery.py
      - tests/contract/test_agent_loop_worker_v155_deploy_recovery.ps1
      - tests/contract/test_agent_loop_worker_v156_post_merge_recovery.py
      - tests/contract/test_agent_loop_worker_v156_deploy_recovery.ps1
      - tests/contract/v156_dynamic_test_support.py
      - tests/contract/test_agent_loop_worker_v157_runtime_resolution.py
      - tests/contract/test_agent_loop_worker_v157_real_cmd_quoting.py
      - tests/contract/test_agent_loop_worker_v157_lossless_transport.py
      - tests/contract/test_agent_loop_worker_v157_prompt_delivery.py
      - tests/contract/test_agent_loop_worker_v157_state_event_contract.py
      - tests/contract/test_agent_loop_worker_v157_codex_supervisor_contract.py
      - tests/contract/test_agent_loop_worker_v157_deploy_recovery.ps1
      - tests/contract/test_agent_loop_worker_r1_1_roadmap_manifest.py
      - .github/workflows/agent-loop-worker-contract.yml

concurrency:
  group: agent-loop-worker-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'control-plane/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: py_compile
        run: |
          python -m py_compile scripts/agent_loop/local_worker/agent_worker.py
          python -m py_compile scripts/agent_loop/local_worker/v156_recovery_common.py
          python -m py_compile scripts/agent_loop/local_worker/v156_recovery_transaction.py
          python -m py_compile scripts/agent_loop/local_worker/v156_post_merge_recovery.py
          python -m py_compile scripts/agent_loop/pilot_verify.py
          python -m py_compile tests/contract/test_agent_loop_worker_hardening_02.py
          python -m py_compile tests/contract/test_agent_loop_worker_v153_regression.py
          python -m py_compile tests/contract/test_agent_loop_worker_v153_base_advance.py
          python -m py_compile tests/contract/test_agent_loop_worker_v154_repair.py
          python -m py_compile tests/contract/test_agent_loop_worker_v154_transaction_notifications.py
          python -m py_compile tests/contract/test_agent_loop_worker_v155_quiescence_recovery.py
          python -m py_compile tests/contract/v156_dynamic_test_support.py
          python -m py_compile tests/contract/test_agent_loop_worker_v156_post_merge_recovery.py
          python -m py_compile tests/contract/test_agent_loop_worker_v157_runtime_resolution.py
          python -m py_compile tests/contract/test_agent_loop_worker_v157_real_cmd_quoting.py
          python -m py_compile tests/contract/test_agent_loop_worker_v157_lossless_transport.py
          python -m py_compile tests/contract/test_agent_loop_worker_v157_prompt_delivery.py
          python -m py_compile tests/contract/test_agent_loop_worker_v157_state_event_contract.py
          python -m py_compile tests/contract/test_agent_loop_worker_v157_codex_supervisor_contract.py
          python -m py_compile tests/contract/test_agent_loop_worker_r1_1_roadmap_manifest.py
      - name: worker SHA-256 evidence
        run: python -c "import hashlib,pathlib; p=pathlib.Path('scripts/agent_loop/local_worker/agent_worker.py'); print('WORKER_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest().upper())"
      - name: hardening contract
        run: python tests/contract/test_agent_loop_worker_hardening_02.py
      - name: v1.5.3 regression contract
        run: python tests/contract/test_agent_loop_worker_v153_regression.py
      - name: v1.5.3 base advance contract
        run: python tests/contract/test_agent_loop_worker_v153_base_advance.py
      - name: v1.5.4 repair contract
        run: python tests/contract/test_agent_loop_worker_v154_repair.py
      - name: v1.5.4 transaction and notification contract
        run: python tests/contract/test_agent_loop_worker_v154_transaction_notifications.py
      - name: v1.5.4 PowerShell deploy rollback contract
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/contract/test_agent_loop_worker_v154_deploy_rollback.ps1
      - name: v1.5.5 quiescence recovery contract
        run: python tests/contract/test_agent_loop_worker_v155_quiescence_recovery.py
      - name: v1.5.5 PowerShell deploy recovery contract
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/contract/test_agent_loop_worker_v155_deploy_recovery.ps1
      - name: v1.5.6 dynamic post-merge recovery contract
        run: python tests/contract/test_agent_loop_worker_v156_post_merge_recovery.py
      - name: v1.5.6 PowerShell dynamic deploy recovery contract
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/contract/test_agent_loop_worker_v156_deploy_recovery.ps1
      - name: v1.5.7 runtime resolution contract
        run: python tests/contract/test_agent_loop_worker_v157_runtime_resolution.py
      - name: v1.5.7 real cmd quoting contract
        run: python tests/contract/test_agent_loop_worker_v157_real_cmd_quoting.py
      - name: v1.5.7 lossless transport contract
        run: python tests/contract/test_agent_loop_worker_v157_lossless_transport.py
      - name: v1.5.7 prompt delivery contract
        run: python tests/contract/test_agent_loop_worker_v157_prompt_delivery.py
      - name: v1.5.7 state and event contract
        run: python tests/contract/test_agent_loop_worker_v157_state_event_contract.py
      - name: v1.5.7 codex supervisor contract
        run: python tests/contract/test_agent_loop_worker_v157_codex_supervisor_contract.py
      - name: v1.5.7 PowerShell deploy recovery contract
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/contract/test_agent_loop_worker_v157_deploy_recovery.ps1
      - name: R1.1 roadmap manifest contract
        run: python tests/contract/test_agent_loop_worker_r1_1_roadmap_manifest.py
      - name: git diff check
        run: git diff --check
