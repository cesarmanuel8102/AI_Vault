name: Operator Proxy Codex Supervisor
on: {pull_request: {paths: ['scripts/operator_proxy/**','tests/contract/operator_proxy/**','docs/operator_proxy/**','docs/roadmap/**','ROADMAP_STATUS.json','docs/MIGRATION_CONTROL_LEDGER.md','.github/codex/operator-proxy-**','.github/workflows/operator-proxy-**','.github/workflows/agent-loop-worker-contract.yml']}}
permissions: {contents: read}
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'cesarmanuel8102'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify deterministic safety boundary
        run: |
          grep -q 'builder_session!==e.review_session' scripts/operator_proxy/policy_engine.ts
          grep -q 'ESCALATE_TO_OWNER' scripts/operator_proxy/policy_engine.ts
          grep -q 'operator-proxy-merge.yml' scripts/operator_proxy/github_bus.ts
          grep -q 'GH_TOKEN:.*github.token' .github/workflows/operator-proxy-merge.yml
          ! grep -RniE '(--auto-merge|--squash|--rebase|--force-with-lease|push --force)' scripts/operator_proxy/*.ts
          codex_action='openai/codex'; codex_action="${codex_action}-action"
          ! grep -Rni "$codex_action" .github/workflows/operator-proxy-codex-supervisor.yml scripts/operator_proxy/reviewer_*.ts scripts/operator_proxy/opencode_reviewer.ts
          api_key_input='openai-api'; api_key_input="${api_key_input}-key:"
          ! grep -Rni "$api_key_input" .github/workflows/operator-proxy-codex-supervisor.yml scripts/operator_proxy/reviewer_*.ts scripts/operator_proxy/opencode_reviewer.ts
      - name: Bind immutable PR review range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          python - <<'PY'
          import json, os
          receipt = {
              "schema_version": 1,
              "gate": "DETERMINISTIC_BOUNDARY_ONLY",
              "intelligent_review": False,
              "required_runtime_reviewer": "opencode_ollama_reviewer_router",
              "base_sha": os.environ["BASE_SHA"],
              "head_sha": os.environ["HEAD_SHA"],
          }
          with open("operator-proxy-review-boundary.json", "w", encoding="utf-8") as fh:
              json.dump(receipt, fh, sort_keys=True)
              fh.write("\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: operator-proxy-review-boundary
          path: operator-proxy-review-boundary.json
          if-no-files-found: error
      - name: Require local intelligent reviewer contract
        run: |
          grep -q 'class ReviewerRouter' scripts/operator_proxy/reviewer_router.ts
          grep -q 'OpenCodeReviewerBackend' scripts/operator_proxy/opencode_reviewer.ts
          grep -q 'SINGLE_REVIEWER_UNAVAILABLE' scripts/operator_proxy/reviewer_router.ts
          grep -q 'REVIEWER_WRITE_ATTEMPT' scripts/operator_proxy/opencode_reviewer.ts
