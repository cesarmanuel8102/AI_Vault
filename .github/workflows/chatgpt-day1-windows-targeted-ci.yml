name: chatgpt-day1-windows-targeted-ci

on:
  push:
    branches:
      - chatgpt/day1-writer-timeout-fix

jobs:
  targeted-windows-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-asyncio "pydantic>=2,<3" pydantic-settings sqlalchemy defusedxml tomli ibapi ib-insync pywin32

      - name: Compile authority path
        shell: pwsh
        run: |
          python -m py_compile ibkr_paper_30d/authoritative_broker_writer.py
          python -m py_compile ibkr_paper_30d/production_continuity_runtime.py
          python -m py_compile ibkr_paper_30d/production_authority.py
          python -m py_compile ibkr_paper_30d/autonomous_execution.py

      - name: Run targeted Day1 authority regression
        shell: pwsh
        run: |
          pytest -q tests/ibkr_paper_30d/test_authoritative_broker_writer.py tests/ibkr_paper_30d/test_production_continuity_runtime.py tests/ibkr_paper_30d/test_production_authority.py tests/ibkr_paper_30d/test_model_execution_engine.py tests/ibkr_paper_30d/test_autonomous_execution.py tests/ibkr_paper_30d/test_continuity_binding.py
